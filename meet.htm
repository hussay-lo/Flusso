<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clips - Coming Soon</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: system-ui, -apple-system, Arial, sans-serif;
      background: #f7f7f5;
      color: #222;
      text-align: center;
    }

    .card {
      max-width: 480px;
      width: 100%;
      background: #fff;
      border-top: 6px solid #009246; /* green */
      border-radius: 12px;
      padding: 48px 32px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    .badge {
      display: inline-block;
      background: #ffb400;
      color: #000;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 4px 14px;
      border-radius: 999px;
      margin-bottom: 20px;
    }

    h1 { font-size: 32px; margin-bottom: 12px; }

    p { color: #555; line-height: 1.6; margin-bottom: 28px; }

    a.back {
      display: inline-block;
      background: #ce2b37; /* red */
      color: #fff;
      text-decoration: none;
      padding: 10px 24px;
      border-radius: 8px;
      font-weight: bold;
    }

    a.back:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">Coming Soon</span>
    <h1>Meet Flusso</h1>
    <p>We are still working on this section. It has not been launched yet, but it will be available soon.</p>
    <a class="back" href="index.html">Back to Home</a>
  </main>
</body>
</html>
