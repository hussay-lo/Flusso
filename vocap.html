<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learn | Flusso</title>
 
  <!-- Fonts: copy the exact link from your home page if it is different -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Figtree:wght@500;600;700;800&display=swap" rel="stylesheet">
 
  <!-- Shared styles first, then this page's styles -->
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="learn.css">
</head>
 
<body class="inner-page">
 
  <header class="flusso-header">
    <a class="flusso-brand" href="index.html" aria-label="Flusso, home">
      <img class="flusso-logo" src="image__1_-removebg-preview.png" alt="Flusso Logo">
      <span class="flusso-name" aria-hidden="true">LUSSO</span>
    </a>

    <div class="topbar-left">
      <span class="avatar" role="img" aria-label="Profile">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="8.5" r="3.5" />
          <path d="M5 20c.8-3.5 3.7-5.5 7-5.5s6.2 2 7 5.5" />
        </svg>
      </span>

      <button id="saved-btn" class="icon-btn" aria-label="Saved words">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 3.5h11.5A1.5 1.5 0 0 1 19 5v13.5a1.5 1.5 0 0 1-1.5 1.5H6.5A2.5 2.5 0 0 1 4 17.5v-12A2 2 0 0 1 6 3.5z" />
          <path d="M4 17.5A2.5 2.5 0 0 1 6.5 15H19" />
          <path d="M9 7.5h6" />
        </svg>
      </button>
    </div>

    <nav class="flusso-nav" aria-label="Main">
      <a href="learn.html" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 11.5 12 4l9 7.5" />
          <path d="M5.5 10v10h13V10" />
          <path d="M10 20v-5h4v5" />
        </svg>
        <span>Home</span>
      </a>
      <a href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 6.5C10.4 5 8 4.5 4 4.5v13c4 0 6.4.5 8 2 1.6-1.5 4-2 8-2v-13c-4 0-6.4.5-8 2z" />
          <path d="M12 6.5v13" />
        </svg>
        <span>Vocab</span>
      </a>
      <a href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 15v-3a8 8 0 0 1 16 0v3" />
          <rect x="3" y="14" width="4" height="7" rx="1.5" />
          <rect x="17" y="14" width="4" height="7" rx="1.5" />
        </svg>
        <span>Listening</span>
      </a>
      <a href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L8 19z" />
          <path d="M14.5 6.5l3 3" />
        </svg>
        <span>Grammar</span>
      </a>
    </nav>

    <span class="flag" role="img" aria-label="Italian"></span>
  </header>
 
  <main class="learn-html">
 
    <section id="topics-view" class="view">
      <div id="level-list" class="level-list" role="group" aria-label="Levels"></div>
      <ul id="topic-list" class="topic-list"></ul>
    </section>
 
    <section id="learn-view" class="view" hidden>
      <button id="back-btn" class="back-btn">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M15 6l-6 6 6 6" />
        </svg>
        Topics
      </button>
 
      <h2 id="topic-title" class="topic-heading"></h2>
 
      <section class="learn-card">
        <button id="speak-btn" class="speak-btn" aria-label="Listen to the word" hidden>
 
          <svg viewBox="0 0 24 24" width="32" height="32" aria-hidden="true">
            <path fill="currentColor" d="M4 9.5v5a1 1 0 0 0 1 1h3l4.2 3.5A1 1 0 0 0 14 18.2V5.8a1 1 0 0 0-1.8-.8L8 8.5H5a1 1 0 0 0-1 1z" />
            <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M17 9a4.5 4.5 0 0 1 0 6M19.5 6.5a8 8 0 0 1 0 11" />
          </svg>
        </button>
        <p id="italian-word" class="card-word">Tap Learn to start</p>
        <p id="english-word" class="card-translation"></p>
      </section>
 
      <div class="actions">
        <button id="learn-btn" class="btn btn-primary">Learn</button>
        <button id="save-btn" class="btn btn-outline">Save</button>
      </div>
 
      <button id="quiz-btn" class="btn btn-quiz" hidden>Take the quiz</button>
    </section>

    <section id="saved-view" class="view" hidden>
      <button id="saved-back-btn" class="back-btn">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M15 6l-6 6 6 6" />
        </svg>
        Back
      </button>

      <h2 class="topic-heading">Saved words</h2>
      <ul id="saved-list" class="saved-list"></ul>
    </section>

    <section id="quiz-view" class="view" hidden>
      <button id="quiz-back-btn" class="back-btn">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M15 6l-6 6 6 6" />
        </svg>
        Back
      </button>
 
      <div class="quiz-bar" aria-hidden="true">
        <div id="quiz-bar-fill" class="quiz-bar-fill"></div>
      </div>
      <p id="quiz-count" class="quiz-count"></p>
 
      <div id="quiz-play" class="view">
        <section class="quiz-card">
          <p id="quiz-sentence" class="card-word"></p>
          <p id="quiz-translation" class="card-translation"></p>
        </section>
 
        <div id="quiz-options" class="quiz-options"></div>
 
        <p id="quiz-feedback" class="quiz-feedback" aria-live="polite"></p>
 
        <button id="quiz-next-btn" class="btn btn-primary quiz-next" hidden>Continue</button>
      </div>
 
      <div id="quiz-result" class="view" hidden>
        <section class="quiz-card">
          <p id="quiz-score-text" class="card-word"></p>
          <p id="quiz-message" class="card-translation"></p>
        </section>
 
        <div class="actions">
          <button id="quiz-retry-btn" class="btn btn-primary">Try again</button>
          <button id="quiz-exit-btn" class="btn btn-outline">Back to topic</button>
        </div>
      </div>
    </section>
 
  </main>
  <script src="words.js"></script>
  <script src="learn.js"></script>
</body>
</html>
